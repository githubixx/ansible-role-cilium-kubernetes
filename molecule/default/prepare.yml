- name: Prepare the assets host Kubernetes SDK
  hosts: k8s_assets
  gather_facts: false
  tasks:
    - name: Bootstrap the guest-local SDK as the execution user
      become: false
      tags: cilium_sdk
      vars:
        ansible_become: false
        ansible_python_interpreter: python3
        # Pin the upstream Linux x86_64 uv archive used on the assets VM.
        cilium__uv_version: "0.13.6"

        # SHA-256 digest of the archive for the pinned version.
        cilium__uv_checksum: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
      block:
        - name: Gather assets host facts with the system interpreter
          ansible.builtin.setup:

        - name: Require the supported guest architecture
          ansible.builtin.assert:
            that: ansible_facts.architecture == 'x86_64'
            fail_msg: The pinned Molecule uv archive requires an x86_64 assets guest.

        - name: Create guest-local SDK directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "~/.cache/cilium-molecule"
            - "~/.local/share/cilium-molecule"
            - "~/.local/share/cilium-molecule/uv-{{ cilium__uv_version }}"

        - name: Download the pinned uv archive
          ansible.builtin.get_url:
            url: "https://github.com/astral-sh/uv/releases/download/{{ cilium__uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
            dest: "~/.cache/cilium-molecule/uv-{{ cilium__uv_version }}.tar.gz"
            checksum: "sha256:{{ cilium__uv_checksum }}"
            mode: "0644"

        - name: Extract the guest-local uv binary
          ansible.builtin.unarchive:
            src: "~/.cache/cilium-molecule/uv-{{ cilium__uv_version }}.tar.gz"
            dest: "~/.local/share/cilium-molecule/uv-{{ cilium__uv_version }}"
            remote_src: true
            extra_opts: [--strip-components=1]
            creates: "~/.local/share/cilium-molecule/uv-{{ cilium__uv_version }}/uv"

        - name: Create the guest-local SDK environment
          ansible.builtin.command:
            argv: [".local/share/cilium-molecule/uv-{{ cilium__uv_version }}/uv", venv, --python, python3, "{{ cilium__assets_sdk_directory }}"]
            chdir: /home/vagrant
            creates: "{{ cilium__assets_sdk_directory }}/bin/python"

        - name: Install supported Kubernetes SDK dependencies
          ansible.builtin.command:
            argv:
              - ".local/share/cilium-molecule/uv-{{ cilium__uv_version }}/uv"
              - pip
              - install
              - --python
              - "{{ cilium__assets_sdk_directory }}/bin/python"
              - kubernetes==35.0.0
              - PyYAML
              - jsonpatch
              - cryptography
            chdir: /home/vagrant
          register: cilium__assets_sdk_install
          changed_when: "'Installed ' in cilium__assets_sdk_install.stderr or 'Uninstalled ' in cilium__assets_sdk_install.stderr"

- name: Update cache
  hosts: k8s
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
    - name: Reboot for kernel updates
      ansible.builtin.reboot:

- name: Harden hosts
  hosts: all
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Setup harden_linux role
      ansible.builtin.include_role:
        name: githubixx.harden_linux

- name: Setup Wireguard VPN
  hosts: vpn
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Setup wireguard role
      ansible.builtin.include_role:
        name: githubixx.ansible_role_wireguard

- name: Setup cfssl
  hosts: k8s_assets
  become: true
  gather_facts: false
  tasks:
    - name: Install cfssl
      ansible.builtin.include_role:
        name: githubixx.cfssl

- name: Setup Kubernetes certificates
  hosts: k8s_assets
  gather_facts: false
  tasks:
    - name: Generate etcd and K8s TLS certificates
      ansible.builtin.include_role:
        name: githubixx.kubernetes_ca

    - name: Copy certificate files from assets to local host
      ansible.posix.synchronize:
        mode: pull
        src: "{{ k8s_ca_conf_directory }}"
        dest: "/tmp"

- name: Setup etcd
  hosts: k8s_etcd
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Include etcd role
      ansible.builtin.include_role:
        name: githubixx.etcd

- name: Setup Kubernetes client tooling
  hosts: k8s_assets
  become: true
  gather_facts: true
  tasks:
    - name: Install kubectl
      ansible.builtin.include_role:
        name: githubixx.kubectl

    - name: Install support packages
      ansible.builtin.package:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - conntrack
          - git
          - python3-pip

    - name: Install kubernetes Python package
      ansible.builtin.package:
        name: python3-kubernetes
        state: present

    - name: Install Helm role
      ansible.builtin.include_role:
        name: gantsign.helm

    - name: Install Helm diff plugin for the execution user
      become: false
      kubernetes.core.helm_plugin:
        plugin_path: https://github.com/databus23/helm-diff
        plugin_version: v3.14.0
        state: present
      vars:
        ansible_become: false

- name: Setup HAProxy
  hosts: haproxy
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Setup haproxy role
      ansible.builtin.include_role:
        name: githubixx.haproxy

- name: Setup containerd
  hosts: k8s_worker
  become: true
  gather_facts: true
  tasks:
    - name: Include runc role
      ansible.builtin.include_role:
        name: githubixx.runc

    - name: Include CNI role
      ansible.builtin.include_role:
        name: githubixx.cni

    - name: Include containerd role
      ansible.builtin.include_role:
        name: githubixx.containerd

- name: Setup Kubernetes controller
  hosts: k8s_controller
  become: true
  gather_facts: true
  tasks:
    - name: Include kubernetes_controller role
      ansible.builtin.include_role:
        name: githubixx.kubernetes_controller

- name: Prepare kubeconfig for vagrant user
  hosts: k8s_assets
  become: true
  gather_facts: false
  vars:
    k8s_controller__vagrant_kube_directory: "/home/vagrant/.kube"
  tasks:
    - name: Ensure .kube directory in vagrant home
      ansible.builtin.file:
        path: "{{ k8s_controller__vagrant_kube_directory }}"
        state: directory
        mode: "0700"
        owner: "vagrant"
        group: "vagrant"

    - name: Copy admin.kubeconfig to vagrant home directory
      ansible.builtin.copy:
        src: "{{ k8s_admin_conf_dir }}/admin.kubeconfig"
        dest: "{{ k8s_controller__vagrant_kube_directory }}/config"
        mode: "0400"
        remote_src: true
        owner: "vagrant"
        group: "vagrant"

- name: Setup Kubernetes worker
  hosts: k8s_worker
  become: true
  gather_facts: true
  tasks:
    - name: Include kubernetes_worker role
      ansible.builtin.include_role:
        name: githubixx.kubernetes_worker

- name: Setup Cilium CLI
  hosts: test-assets
  become: true
  tasks:
    - name: Include cilium_cli role
      ansible.builtin.include_role:
        name: githubixx.cilium_cli
